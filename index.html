<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="A private, phone-first daily planner with schedules, central habits, progress, and local storage.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <title>Planner</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>
  <script src="./js/defaults.js" defer></script>
  <script src="./js/icons.js" defer></script>
  <script src="./js/habit-model.js" defer></script>
  <script src="./js/app.js" defer></script>
</head>
<body>
  <div id="app" class="app"></div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Primary navigation"></nav>
  <button class="fab" id="fab" type="button" aria-label="Add task">+</button>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
